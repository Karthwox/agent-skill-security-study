<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Notes</title><script src="config.js"></script></head>
<body>
  <h1>Notes</h1>
  <form id="auth">
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="button" id="login">Log in</button>
    <button type="button" id="signup">Sign up</button>
  </form>
  <form id="new" hidden>
    <input id="title" placeholder="Title" required>
    <textarea id="body" placeholder="Write something"></textarea>
    <button type="submit">Add note</button>
  </form>
  <p id="message" role="status"></p>
  <ul id="list"></ul>
  <script>
    const api = (path, options = {}) => fetch(window.API_URL + path, {
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      ...options,
    });
    const $ = (id) => document.getElementById(id);
    const say = (text) => { $("message").textContent = text; };

    async function load() {
      const res = await api("/notes");
      if (!res.ok) { $("new").hidden = true; return; }
      $("new").hidden = false;
      $("list").replaceChildren(...(await res.json()).map((n) => {
        const li = document.createElement("li");
        const strong = document.createElement("strong");
        strong.textContent = n.title;
        const p = document.createElement("p");
        p.textContent = n.body;
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = async () => { await api("/notes/" + n.id, { method: "DELETE" }); load(); };
        li.append(strong, p, del);
        return li;
      }));
    }
    const creds = () => JSON.stringify({ email: $("email").value, password: $("password").value });
    $("signup").onclick = async () => { const r = await api("/signup", { method: "POST", body: creds() }); say(r.ok ? "Account created. Log in." : "Sign up failed"); };
    $("login").onclick = async () => { const r = await api("/login", { method: "POST", body: creds() }); say(r.ok ? "" : "Login failed"); load(); };
    $("new").onsubmit = async (e) => {
      e.preventDefault();
      await api("/notes", { method: "POST", body: JSON.stringify({ title: $("title").value, body: $("body").value }) });
      e.target.reset(); load();
    };
    load();
  </script>
</body>
</html>
